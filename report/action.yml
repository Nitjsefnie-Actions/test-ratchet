name: test-ratchet report
description: Merge the run artifacts' coverage, gate it against the floor at the base, comment on the pull request and ratchet the records on the default branch.
inputs:
  github-token:
    description: The token that downloads the artifacts and writes the pull request comment, normally github.token.
    required: true
  thresholds:
    description: Path of the thresholds file, relative to the repository root.
    required: false
    default: .github/ci-thresholds.json
  times:
    description: Path of plan's times file, relative to the repository root, rewritten on the default branch. Empty leaves times alone.
    required: false
    default: ''
  cell:
    description: The one cell whose coverage is gated and ratcheted. Default is the records' cell, otherwise the only cell present.
    required: false
    default: ''
  base-ref:
    description: The commit whose thresholds file holds the floors. Empty reads the checkout's file, or the pull request's base on a workflow_run event.
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  run-id:
    description: The workflow run whose test-ratchet artifacts are read.
    required: false
    default: ${{ github.run_id }}
  precision:
    description: "Decimals each language's coverage is shown and recorded at, a whole number from 1 to 6. At 1 the figure is coverage report --precision=1's and is compared with the floor; above 1 the figure is truncated and the exact coverage is compared."
    required: false
    default: '1'
  hysteresis:
    description: How far, in percentage points, coverage must exceed the recorded measured value before the records move. The thresholds file's hysteresis key overrides it.
    required: false
    default: '1.5'
  gap:
    description: How far, in percentage points, a raised floor sits below the new measured value, rounded down to precision decimals. The thresholds file's gap key overrides it.
    required: false
    default: '1.5'
  workflow-run-gate:
    description: "'true' makes a workflow_run run whose triggering run was a pull_request run fail as that run's report does. Its status lands on the default branch's commit."
    required: false
    default: 'false'
  records-only-rise:
    description: "'true' fails the step when the thresholds file lowers or removes a coverage record, gives a new or changed measured a floor below the one a raise would give, or raises, removes or adds a looser gap or hysteresis key, against the merge base on a pull request and the previous tip on a default-branch push."
    required: false
    default: 'false'
  gate-raised-floors:
    description: "'true' gates each language whose floor a pull request raises or adds in its own thresholds file, against the merge base, by the higher of the base's floor and the head's, on a pull_request run and a gating workflow_run run."
    required: false
    default: 'false'
  comment-check:
    description: "The name of a check run that, on a workflow_run run whose triggering run was a pull_request run, is published on the pull request's head: success when the comment was written, failure when it could not be, when the pull request lookup failed or when several pull requests hold the run's head. It needs checks: write. Empty publishes none."
    required: false
    default: ''
  push-key:
    description: SSH deploy key with write access, the default branch's push environment secret. Empty leaves the new records in the job summary.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # A directory this step creates, so no earlier writer chose where the artifacts land.
    - id: dir
      shell: bash
      run: |
        dir="$(mktemp -d "$RUNNER_TEMP/test-ratchet-artifacts.XXXXXX")"
        echo "path=$dir" >> "$GITHUB_OUTPUT"
    # An empty listing succeeds under a pattern, and a failure keeps what it unpacked.
    - id: first
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-ratchet-*
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.dir.outputs.path }}
    - id: after_first
      shell: bash
      env:
        TEST_RATCHET_ARTIFACTS: ${{ steps.dir.outputs.path }}
        TEST_RATCHET_OUTCOME: ${{ steps.first.outcome }}
      run: bash "$GITHUB_ACTION_PATH/retry.sh" 5
    - id: second
      if: steps.after_first.outputs.retry == 'true'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-ratchet-*
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.dir.outputs.path }}
    - id: after_second
      if: steps.after_first.outputs.retry == 'true'
      shell: bash
      env:
        TEST_RATCHET_ARTIFACTS: ${{ steps.dir.outputs.path }}
        TEST_RATCHET_OUTCOME: ${{ steps.second.outcome }}
      run: bash "$GITHUB_ACTION_PATH/retry.sh" 10
    - id: third
      if: steps.after_second.outputs.retry == 'true'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-ratchet-*
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.dir.outputs.path }}
    - id: after_third
      if: steps.after_second.outputs.retry == 'true'
      shell: bash
      env:
        TEST_RATCHET_ARTIFACTS: ${{ steps.dir.outputs.path }}
        TEST_RATCHET_OUTCOME: ${{ steps.third.outcome }}
      run: bash "$GITHUB_ACTION_PATH/retry.sh" 20
    - id: fourth
      if: steps.after_third.outputs.retry == 'true'
      continue-on-error: true
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-ratchet-*
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.dir.outputs.path }}
    - id: after_fourth
      if: steps.after_third.outputs.retry == 'true'
      shell: bash
      env:
        TEST_RATCHET_ARTIFACTS: ${{ steps.dir.outputs.path }}
        TEST_RATCHET_OUTCOME: ${{ steps.fourth.outcome }}
      run: bash "$GITHUB_ACTION_PATH/retry.sh" 40
    - if: steps.after_fourth.outputs.retry == 'true'
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: test-ratchet-*
        run-id: ${{ inputs.run-id }}
        github-token: ${{ inputs.github-token }}
        path: ${{ steps.dir.outputs.path }}
    - shell: bash
      env:
        TEST_RATCHET_ARTIFACTS: ${{ steps.dir.outputs.path }}
        TEST_RATCHET_GITHUB_TOKEN: ${{ inputs.github-token }}
        TEST_RATCHET_THRESHOLDS: ${{ inputs.thresholds }}
        TEST_RATCHET_TIMES: ${{ inputs.times }}
        TEST_RATCHET_CELL: ${{ inputs.cell }}
        TEST_RATCHET_BASE_REF: ${{ inputs.base-ref }}
        TEST_RATCHET_PRECISION: ${{ inputs.precision }}
        TEST_RATCHET_HYSTERESIS: ${{ inputs.hysteresis }}
        TEST_RATCHET_GAP: ${{ inputs.gap }}
        TEST_RATCHET_WORKFLOW_RUN_GATE: ${{ inputs.workflow-run-gate }}
        TEST_RATCHET_RECORDS_ONLY_RISE: ${{ inputs.records-only-rise }}
        TEST_RATCHET_GATE_RAISED_FLOORS: ${{ inputs.gate-raised-floors }}
        TEST_RATCHET_COMMENT_CHECK: ${{ inputs.comment-check }}
        TEST_RATCHET_PUSH_KEY: ${{ inputs.push-key }}
      run: |
        # The consumer's own interpreter: no setup-python, so its PATH is untouched.
        if command -v python3 >/dev/null 2>&1; then
          TEST_RATCHET_PYTHON=python3
        else
          TEST_RATCHET_PYTHON=python
        fi
        "$TEST_RATCHET_PYTHON" -I "$GITHUB_ACTION_PATH/main.py"
