# pycodestyle configuration for the suites job's pycodestyle gate. The
# ceiling is 100 columns. An `ignore =` line REPLACES pycodestyle's default
# ignore list rather than extending it, so the line below is that default
# list (E121, E123, E126, E226, E24, E704, W503, W504) spelled out: a code
# this tree needs to add is appended with a line naming the shape the
# checker cannot see the reason for.
[pycodestyle]
max-line-length = 100
ignore = E121,E123,E126,E226,E24,E704,W503,W504
